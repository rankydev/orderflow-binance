name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    # Migrationen und Schema-Test gegen dieselbe gepinnte Timescale-Version wie docker-compose.yml.
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.31.2-pg17
        env:
          POSTGRES_USER: of_admin
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orderflow
        ports:
          - 127.0.0.1:54320:5432
        options: >-
          --health-cmd "pg_isready -U of_admin -d orderflow"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OF_DB_HOST: 127.0.0.1
      OF_DB_PORT: '54320'
      OF_DB_USER: of_admin
      OF_DB_PASSWORD: ci-only-password
      OF_DB_NAME: orderflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate # zweiter Lauf muss ein No-op sein
      - run: npm run test:db

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verifier/requirements-dev.txt
      - run: npm run py:setup
      - run: npm run lint:py
      - run: npm run test:py
