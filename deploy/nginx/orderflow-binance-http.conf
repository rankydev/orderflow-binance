# Ziel: /etc/nginx/conf.d/orderflow-binance.conf  (http-Kontext, von nginx.conf vor sites-enabled
# eingebunden). NUR Zonen-Definitionen, kein server-Block (ein server-Block hier würde wegen der
# Include-Reihenfolge zum Standardserver für unbekannte Hostnamen). Namen mit Präfix orderflow_,
# beim Survey 2026-11-24 gab es keine anderen limit_*_zone-Definitionen auf dem Server.

# STELLSCHRAUBE 1/2: mittlere Rate je Client-IP auf /api/ (Burst = Stellschraube 2 im Site-File).
# Seitenstart ≈ 1 /symbols + ≈ 20 Bars-Abschnitte + 4–8 Kacheln; schnelles Schwenken 16–40 r/s
# (zwei Client-Warteschlangen × 4 parallel, 100–250 ms je Antwort). 10 MB ≈ 160 000 IPs.
limit_req_zone $binary_remote_addr zone=orderflow_api:10m rate=30r/s;
# Je Client-IP: gleichzeitige Verbindungen auf /api/
limit_conn_zone $binary_remote_addr zone=orderflow_conn:10m;
# /api/v1/quality: teuer und ungecacht → je Client-IP 1 Anfrage/s, Burst 5 (Site-File)
limit_req_zone $binary_remote_addr zone=orderflow_quality:10m rate=1r/s;
# /api/v1/live (SSE, Live-Updates Etappe 1): gleichzeitige Live-Ströme je Client-IP (Site-File: 4).
# Eigene Zone, damit lang offene Live-Verbindungen nicht das Kontingent von /api/ (orderflow_conn)
# aufbrauchen und umgekehrt.
limit_conn_zone $binary_remote_addr zone=orderflow_live_conn:10m;
