# Ziel: /etc/nginx/snippets/orderflow-binance-headers.conf
# Sicherheits-Header für orderflow.rankyhub.com. In jeder location mit eigenem add_header erneut
# eingebunden (nginx erbt add_header nicht in locations, die selbst add_header setzen).
# Kein HSTS: die übrigen Sites auf dem Server setzen es nicht (bewusst gleichgezogen).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: EINE Zeile zum Anpassen. Kandidat des Web-Reviews; der endgültige, im Browser geprüfte Wert
# steht im README (Abschnitt Web) – vor dem Rollout von dort übernehmen (Runbook Schritt 0).
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-3pRED1tOXas1FXFoPb9TGCjmYe9XQsmO9OV23khV2nY='; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
