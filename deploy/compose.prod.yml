# Produktion auf dem VPS (KONZEPT §2.4): PostgreSQL 17 + TimescaleDB und die lesende API.
# Getrennt von der Entwicklungs-Datei docker-compose.yml im Repo-Wurzelverzeichnis.
# Auf dem Server: /opt/orderflow-binance/compose.prod.yml + .env (nur OF_RELEASE), Aufruf immer mit
#   docker compose -p orderflow-binance -f /opt/orderflow-binance/compose.prod.yml …
# Eigener Projektname, eigene Netz-/Volume-/Containernamen: keine Überschneidung mit „genius-live".
# Secrets nur in /etc/orderflow-binance/*.env (root, 0600), nie in dieser Datei.
name: orderflow-binance

x-logging: &logging
  # journald statt json-file (Daemon-Standard ohne Größenlimit, daemon.json bleibt unberührt);
  # Rotation über die vorhandene journald-Konfiguration (SystemMaxUse=1G, 7 Tage).
  driver: journald
  options:
    tag: '{{.Name}}'

services:
  db:
    # Exakt gepinnt (Tag + Index-Digest, identisch mit dem Mac-Image; Restore nur zwischen gleichen Versionen)
    image: timescale/timescaledb:2.31.2-pg17@sha256:2b09a766b4281bb4fd3d2bec09fcd1cabb87f9c1d669d99d3aa1a7a815c55660
    container_name: orderflow-db
    restart: unless-stopped
    env_file:
      - /etc/orderflow-binance/db.env # POSTGRES_PASSWORD (+ OF_DB_PASSWORD für die Werkzeuge)
    environment:
      POSTGRES_USER: of_admin
      POSTGRES_DB: orderflow
      # timescaledb-tune beim ersten Start abschalten: die Einstellungen stehen unten explizit
      NO_TS_TUNE: 'true'
      # Telemetrie aus (schreibt telemetry_level=off und pausiert den Telemetrie-Job beim Init)
      TIMESCALEDB_TELEMETRY: 'off'
      TZ: UTC
      PGTZ: UTC
    # Nur Loopback (Docker-Portfreigaben umgehen UFW); für Betriebswerkzeuge auf dem Host und
    # SSH-Tunnel vom Mac. Die API spricht die DB über das interne Netz an.
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Übergabeverzeichnis für Dumps (deploy/transfer-db.sh), nur lesend
      - /var/lib/orderflow-binance/transfer:/transfer:ro
    networks: [internal]
    # Speicher: 2 GB Limit (Page-Cache des Containers zählt mit); DB ≈ 0,8 GB passt ganz hinein.
    # Erhöhen auf 2.5g mit P3 (Recorder), wenn PulseBot/mongod gestoppt sind (KONZEPT §2.4).
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    shm_size: 256mb
    pids_limit: 200
    # Bei globalem Speichermangel (kein Swap!) zuerst unsere Container statt der Nachbardienste
    oom_score_adj: 300
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1280MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      # Autovacuum im 2-GB-Limit halten (sonst bis 3 × maintenance_work_mem)
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - max_worker_processes=10
      - -c
      - max_parallel_workers=2
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_maintenance_workers=1
      - -c
      - timescaledb.max_background_workers=4
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=100
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_checkpoints=off
      - -c
      - timezone=UTC
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  api:
    image: orderflow-api:${OF_RELEASE:?OF_RELEASE in /opt/orderflow-binance/.env setzen}
    container_name: orderflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /etc/orderflow-binance/api.env # OF_API_DB_PASSWORD
    environment:
      OF_DB_HOST: db
      OF_DB_PORT: '5432'
      OF_DB_NAME: orderflow
      OF_API_DB_USER: of_api
      # Im Container an alle Schnittstellen (sonst unerreichbar); nach außen nur 127.0.0.1 (ports)
      OF_API_HOST: 0.0.0.0
      OF_API_PORT: '8780'
      # Gleicher Ursprung über nginx; CORS nur für diesen Ursprung
      OF_API_CORS_ORIGINS: https://orderflow.rankyhub.com
      OF_API_DB_POOL: '4'
      OF_API_CACHE_MB: '200'
      # Keep-Alive der API > keepalive_timeout des nginx-Upstreams (60 s), siehe Site-File
      OF_API_KEEPALIVE_TIMEOUT_MS: '65000'
      OF_API_REQUEST_TIMEOUT_MS: '30000'
      OF_API_CONNECTION_TIMEOUT_MS: '30000'
      # Detail-Health nur auf Loopback im Container (nicht veröffentlicht)
      OF_API_ADMIN_PORT: '8781'
      # Diagnose-Header (X-Source, X-Rows-Estimate, Server-Timing) in Produktion aus
      OF_API_DIAG_HEADERS: '0'
      # Minuten-Ereignisse des Recorders (SSE) nur über das Compose-Netz; ohne laufenden Recorder
      # verbindet die API mit Backoff (1–30 s) neu, die Abfrage läuft unabhängig weiter
      OF_API_RECORDER_EVENTS_URL: http://recorder:7701/events
      # Live-Updates (Etappe 1): genau eine SSE-Verbindung zum Recorder, verteilt an /api/v1/live;
      # leer = aus (/api/v1/live antwortet 503, die Seite zeigt „getrennt")
      OF_API_RECORDER_LIVE_URL: http://recorder:7701/live
      # Höchstzahl gleichzeitiger Live-Clients (darüber 503); je Client ≈ 1–2 kB/s. Muss
      # ≤ OF_API_MAX_CONNECTIONS − 64 sein (256 − 64 = 192; die API prüft das beim Start)
      OF_API_LIVE_MAX: '100'
      # Antwort-Cache nicht-finaler Antworten (Standard 10 s) und Verbindungsgrenzen der API
      OF_API_NONFINAL_TTL_MS: '10000'
      OF_API_MAX_CONNECTIONS: '256'
      OF_API_MAX_QUEUE: '64'
      # warn: keine Zeile je Anfrage im Journal (teilt SystemMaxUse=1G mit den Nachbarn); Fehler und
      # fehlgeschlagene Anfragen loggt die API auf warn/error
      OF_LOG_LEVEL: warn
    ports:
      - '127.0.0.1:8780:8780'
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    mem_limit: 600m
    memswap_limit: 600m
    cpus: 1.0
    pids_limit: 100
    oom_score_adj: 500
    stop_grace_period: 20s
    healthcheck:
      # Detail-Health auf dem Loopback-Listener im Container (127.0.0.1:8781/health); vom Host aus
      # nicht erreichbar (nicht veröffentlicht; über den Docker-Proxy wäre die Quelle nicht lokal).
      # NACH DEM API-REVIEW PRÜFEN: Pfad/Port des Status-Listeners (apps/api/src/app.ts).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8781/health').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging

  # Einmalige Betriebswerkzeuge mit dem API-Image (Profil „ops", startet nie von selbst):
  #   … run --rm ops node packages/db/src/cli.ts status|up
  #   … run --rm ops node apps/api/src/cli/api-role-password.ts
  ops:
    image: orderflow-api:${OF_RELEASE:?OF_RELEASE in /opt/orderflow-binance/.env setzen}
    profiles: [ops]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /etc/orderflow-binance/db.env # OF_DB_PASSWORD (Admin/Migrationsrolle)
      - /etc/orderflow-binance/api.env # OF_API_DB_PASSWORD (nur für api-role-password)
      - path: /etc/orderflow-binance/recorder.env # OF_RECORDER_DB_PASSWORD (Rollenpasswort setzen)
        required: false
    environment:
      OF_DB_HOST: db
      OF_DB_PORT: '5432'
      OF_DB_USER: of_admin
      OF_DB_NAME: orderflow
      OF_API_DB_USER: of_api
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    command: ['node', 'packages/db/src/cli.ts', 'status']
    logging: *logging

  # Importer/Wartung mit beschreibbarem Datenverzeichnis (Profil „ops", startet nie von selbst):
  #   … run --rm importer node apps/importer/src/main.ts repair-open-chunks --dry-run
  #   … run --rm importer node apps/importer/src/main.ts import --symbol BTCUSDT --day … --db --online
  # Läuft als of_admin (Eigentümer: Rowstore-Wandlung, Import); Rohdateien unter /data.
  importer:
    image: orderflow-api:${OF_RELEASE:?OF_RELEASE in /opt/orderflow-binance/.env setzen}
    profiles: [ops]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /etc/orderflow-binance/db.env # OF_DB_PASSWORD (Admin)
    environment:
      OF_DB_HOST: db
      OF_DB_PORT: '5432'
      OF_DB_USER: of_admin
      OF_DB_NAME: orderflow
      OF_DATA_DIR: /data
      OF_LOG_LEVEL: info
    volumes:
      - /var/lib/orderflow-binance/data:/data
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1200m
    memswap_limit: 1200m
    cpus: 1.0
    oom_score_adj: 700
    command: ['node', 'apps/importer/src/main.ts', 'repair-open-chunks', '--dry-run']
    logging: *logging

  # Recorder (Live-Daten, KONZEPT §4.2): Profil „recorder" – `up -d` ohne Profil startet ihn nie;
  # gestartet nur ausdrücklich über deploy/recorder.sh start (bin/recorder-ctl.sh).
  recorder:
    image: orderflow-api:${OF_RELEASE:?OF_RELEASE in /opt/orderflow-binance/.env setzen}
    container_name: orderflow-recorder
    profiles: [recorder]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - /etc/orderflow-binance/recorder.env # OF_RECORDER_DB_PASSWORD (Rolle of_recorder)
    environment:
      OF_DB_HOST: db
      OF_DB_PORT: '5432'
      OF_DB_NAME: orderflow
      # eigene Rolle (e938c31): nie Admin-Zugangsdaten; Passwort aus recorder.env
      OF_RECORDER_DB_USER: of_recorder
      OF_DATA_DIR: /data
      OF_RECORDER_SYMBOLS: BTCUSDT,ETHUSDT
      # Rohdateien-Fenster 14 Tage (KONZEPT §2.3); verlangt die Markierung
      # /data/raw/binance-vision/.of-recorder-raw-cache (legt recorder-ctl.sh prepare an)
      OF_RAW_KEEP_DAYS: '14'
      OF_SPOOL_KEEP_DAYS: '7'
      OF_SPOOL_MIN_FREE_GB: '5'
      # REST-Budget: PulseBot teilt sich die IP noch → 25 % von 2400 (KONZEPT §4.2)
      OF_REST_WEIGHT_PER_MIN: '600'
      # Health/Ereignisse: im Container auf allen Schnittstellen, aber KEIN Host-Port – erreichbar
      # nur im Compose-Netz orderflow-binance_net (API-Feed später) und per docker exec (Monitor)
      OF_RECORDER_HTTP_HOST: 0.0.0.0
      OF_RECORDER_HTTP_PORT: '7701'
      OF_RECORDER_FINALISE: '1'
      # Live-Tap GET /live (Etappe 1; nur Compose-Netz, max. 2 Clients): 1 = an, 0 = aus (Rollback)
      OF_LIVE: '1'
      OF_LIVE_HZ: '4'
      OF_LOG_LEVEL: info
      # Heap-Grenze explizit statt aus dem cgroup-Limit abgeleitet (V8-Standard bei 1536m: 864 MB
      # heap_size_limit). Gemessen im Release-Image unter 1536m (Finalisierung 2026-11-25, BTC+ETH):
      # heapUsed-Spitze 552 MB, heapTotal 593 MB, external ≤ 110 MB, RSS ≤ 843 MB; mit
      # --max-old-space-size=512 (und 384) V8-„heap out of memory" nach minutenlangem GC, mit 704
      # und 1024 problemlos. 896 lässt ≈ 300 MB über der Spitze (+ Live-Zustand ≈ 50 MB); siehe unten.
      NODE_OPTIONS: --max-old-space-size=896
    volumes:
      - /var/lib/orderflow-binance/data:/data
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    # Speicher: normal ≈ 102–111 MB RSS; beim Finalisieren eines Tages für beide Symbole im Prozess
    # lokal gemessen Spitze 931 MB (Nachholen allein ≈ 550 MB). 1 GB bzw. 1200 MB ließen zu wenig
    # Reserve (OOM-Kill mitten in der Finalisierung → Neustartschleife); daher 1536 MB. Summe der
    # Limits DB 2 GB + API 0,6 GB + Recorder 1,5 GB = 4,1 GB bei ≈ 4,6 GB verfügbar; tatsächlich
    # belegt (gemessen) DB 1,2 GiB, API 0,17 GiB. Budget im Limit: Old-Space 896 + Young/Code ≈ 100
    # + Nicht-Heap ≈ 230 MB (RSS − heapTotal an der Spitze, inkl. external) ≈ 1,23 GB → ≈ 300 MB
    # Abstand zu 1536 MB, bevor der cgroup-OOM-Killer statt V8 eingreift.
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    pids_limit: 100
    # Bei globalem Speichermangel zuerst der Recorder (Neustart billig: Spool + REST ab letzter ID)
    oom_score_adj: 700
    # Sauberes Beenden: offene Minuten schreiben, Spool schließen; eine laufende Finalisierung mit
    # Sperrversuchen kann ≈ 40 s je Chunk dauern
    stop_grace_period: 120s
    command: ['node', 'apps/recorder/src/main.ts', 'run']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7701/health').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 4
      # Start: Spool-Wiedergabe + REST-Nachholen seit dem letzten gespeicherten Trade. Gemessen
      # (lokal, OF_REST_WEIGHT_PER_MIN=600, beide Symbole gleichzeitig): ≈ 30 REST-Anfragen/min ≈ 7
      # Daten-Minuten je Symbol und Minute → 8 h Rückstand ≈ 70 min. „healthy" verlangt frische
      # Trades aller Symbole; bis dahin zählt die Startphase (2,5 h) nicht als Fehlschlag.
      start_period: 9000s
    logging: *logging

networks:
  internal:
    name: orderflow-binance_net

volumes:
  pgdata:
    name: orderflow-binance_pgdata
